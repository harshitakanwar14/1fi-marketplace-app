<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>1Fi</title>
    <meta name="theme-color" content="#6C5CE7" />
    <link rel="icon" href="/favicon.ico" />
    <style>
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        flex-direction: column;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      // Catch and display any uncaught JS errors visually
      window.addEventListener('error', function(event) {
        var err = document.createElement('div');
        err.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;padding:20px;font-family:monospace;font-size:14px;z-index:99999;overflow:auto;';
        err.innerHTML = '<b style="color:red">App Error (send this to developer):</b><br/><pre>' + (event.message || '') + '\n' + (event.filename || '') + ':' + event.lineno + '\n\n' + (event.error && event.error.stack ? event.error.stack : '') + '</pre>';
        document.body.appendChild(err);
      });
    </script>
  </body>
</html>
